name: Unzip, Deploy Web & Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  unpack-and-prepare:
    name: Extract ZIP to Repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Uploaded ZIP (Skip workflows)
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Mengekstrak $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -x ".github/*" ".github/**" -d .
            rm -f "$ZIP_FILE"
          fi

      - name: Commit Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Ekstrak otomatis file aplikasi dari ZIP"
            git push
          fi

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: unpack-and-prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Extracted Repo
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android-apk:
    name: Build Android Debug APK
    needs: unpack-and-prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Extracted Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets & Capacitor Project
        run: |
          mkdir -p www
          cp index.html manifest.json www/
          cp -r assets www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "LabCalc QC" "com.labcalc.qc" --web-dir=www
          npx cap add android
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp assets/logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp assets/logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabCalc-QC-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
